name: docs
description: The Ignis documentation site.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  ignis:
    path: ..
  jaspr: ^0.23.4
  jaspr_content: ^0.5.4
  jaspr_flutter_embed: ^0.4.11
  jaspr_router: ^0.9.0
  syntax_highlight_lite: ^0.0.1

dev_dependencies:
  build_runner: ^2.10.0
  build_web_compilers: ^4.8.5
  flutter_lints: ^6.0.0
  jaspr_builder: ^0.23.4

jaspr:
  mode: static
  flutter: embedded

scripts:
  analyze: dart analyze
  build: jaspr build
  clean: rm -rf build .dart_tool/build
  format: dart format lib
  generate: dart run build_runner build --delete-conflicting-outputs
  serve: jaspr serve
