# Groups for the AI disclosure report at /internals/ai-disclosure.

groups:
  - label: Library
    paths:
      - lib/**.dart

  - label: Tests
    paths:
      - test/**.dart

  - label: Benchmarks
    paths:
      - benchmark/**.dart
      - benchmark/bench.sh

  - label: Site
    paths:
      - docs/lib/**.dart

  - label: Site Content
    paths:
      - docs/content/**

  - label: Tools
    paths:
      - tool/disclosure.dart

  - label: Prose
    paths:
      - "*.md"
      - benchmark/README.md
      - docs/README.md
      - example/README.md
      - notes/SPRITES.md
      - test/assets/README.md

  - label: Github
    paths:
      - .github/**

excluded:
  - label: Project Configuration
    reason: Structured data.
    paths:
      - .gitignore
      - .mcp.json
      - .vscode/**
      - analysis_options.yaml
      - benchmark/.gitignore
      - benchmark/analysis_options.yaml
      - benchmark/pubspec.yaml
      - docs/.gitignore
      - docs/analysis_options.yaml
      - docs/pubspec.yaml
      - pubspec.yaml
      - tool/disclosure.yaml

  - label: Jaspr Codegen
    reason: Generated by `jaspr_builder`.
    paths:
      - docs/lib/**/*.imports.dart
      - docs/lib/generated/**
      - docs/lib/main.*.options.dart
      - docs/web/flutter_bootstrap.js

  - label: Site Configuration
    reason: Structured data.
    paths:
      - docs/web/CNAME

  - label: Flutter Scaffolding
    reason: Generated by `flutter create`.
    paths:
      - .metadata
      - benchmark/linux/**

  - label: Lockfiles
    reason: Resolved by pub.
    paths:
      - "**/pubspec.lock"

  - label: Goldens
    reason: Generated by the tests.
    paths:
      - test/**/goldens/**

  - label: Test Assets
    reason: Assets.
    paths:
      - test/assets/**

  - label: Art & Fonts
    reason: Assets.
    paths:
      - "*.png"
      - docs/assets/**
      - docs/web/favicon.ico
      - docs/web/fonts/**
      - docs/web/images/**

  - label: License
    reason: Standard MIT license text.
    paths:
      - LICENSE
