# Groups for the AI disclosure report at /internals/ai-disclosure.

groups:
  - label: Library
    paths:
      - packages/*/lib/**.dart

  - label: Tests
    paths:
      - packages/*/test/**.dart

  - label: Benchmarks
    paths:
      - benchmark/**.dart
      - benchmark/bench.sh

  - label: Site
    paths:
      - docs/lib/**.dart

  - label: Site Content
    paths:
      - docs/content/**

  - label: Tools
    paths:
      - tool/disclosure.dart

  - label: Github
    paths:
      - .github/**

excluded:
  - label: Barrels
    reason: Export lists.
    paths:
      - packages/ignis/lib/ignis.dart
      - packages/ignis/lib/src/assets.dart
      - packages/ignis/lib/src/collisions.dart
      - packages/ignis/lib/src/curves.dart
      - packages/ignis/lib/src/devices.dart
      - packages/ignis/lib/src/effects.dart
      - packages/ignis/lib/src/extensions.dart
      - packages/ignis/lib/src/inputs.dart
      - packages/ignis/lib/src/layout.dart
      - packages/ignis/lib/src/math.dart
      - packages/ignis/lib/src/nodes.dart
      - packages/ignis/lib/src/owners.dart
      - packages/ignis/lib/src/sprites.dart

  - label: Project Configuration
    reason: Structured data.
    paths:
      - .gitignore
      - .mcp.json
      - .vscode/**
      - analysis_options.yaml
      - benchmark/.gitignore
      - benchmark/analysis_options.yaml
      - benchmark/pubspec.yaml
      - docs/.gitignore
      - docs/analysis_options.yaml
      - docs/pubspec.yaml
      - packages/*/analysis_options.yaml
      - packages/*/pubspec.yaml
      - pubspec.yaml
      - tool/disclosure.yaml

  - label: Jaspr Codegen
    reason: Generated by jaspr_builder.
    paths:
      - docs/lib/**/*.imports.dart
      - docs/lib/generated/**
      - docs/lib/main.*.options.dart
      - docs/web/flutter_bootstrap.js

  - label: Site Configuration
    reason: Structured data.
    paths:
      - docs/content/_data/*.yaml
      - docs/web/CNAME

  - label: Flutter Scaffolding
    reason: Generated by flutter create.
    paths:
      - benchmark/linux/**
      - packages/*/.metadata

  - label: Lockfiles
    reason: Resolved by pub.
    paths:
      - pubspec.lock

  - label: Goldens
    reason: Generated by the tests.
    paths:
      - packages/*/test/**/goldens/**

  - label: Test Assets
    reason: Assets.
    paths:
      - packages/*/test/assets/**

  - label: Art & Fonts
    reason: Assets.
    paths:
      - assets/**
      - docs/assets/**
      - docs/web/favicon.ico
      - docs/web/fonts/**
      - docs/web/images/**

  - label: Internal Documents
    reason: Maintainer-authored.
    paths:
      - "*.md"
      - benchmark/README.md
      - conventions/*.md
      - docs/README.md
      - example/README.md
      - notes/*.md
      - packages/*/*.md
      - packages/*/test/assets/README.md

  - label: License
    reason: Standard MIT license text.
    paths:
      - LICENSE
