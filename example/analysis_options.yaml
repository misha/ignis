
include: package:flutter_lints/flutter.yaml
linter:
  rules:
    constant_identifier_names: false
analyzer:
  errors:
    body_might_complete_normally_nullable: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
formatter:
  page_width: 100
  trailing_commas: preserve
